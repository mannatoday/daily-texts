# Daily fetch → localize → update site/ → commit/push to master.
# GitHub Pages deploy stays in pages.yml (triggered by site/** pushes).
#
# Schedule (UTC → Asia/Taipei):
#   0 22 * * *  → 06:00 Taipei (primary)
#   0 4 * * *   → 12:00 Taipei (retry if Moravian was late)
# Edit the cron lines below to change the schedule (GitHub cron is always UTC).

name: Daily Publish

on:
  schedule:
    # Configurable: change these cron expressions (UTC).
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite existing output for the day"
        type: boolean
        default: false
      expect_date:
        description: "Expected page date YYYY-MM-DD (empty = today in Asia/Taipei)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PROVIDER: moravian_html
      FORMATS: markdown,html,text,json
      PUBLISHERS: static_site
      SITE_DIR: ./site
      OUTPUT_DIR: ./output
      # No local Ollama on runners; chain ends with fallback (English prayer).
      TRANSLATOR: composite
      TRANSLATORS: openai,anthropic,google,fallback
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-haiku-4-5
      GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
      HTTP_MAX_RETRIES: "3"
      HTTP_RETRY_BACKOFF_SECONDS: "1.0"
      HTTP_USER_AGENT: daily-texts-bot/1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history not required; token needs write for push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Resolve expect date
        id: dates
        run: |
          if [ -n "${{ inputs.expect_date }}" ]; then
            EXPECT="${{ inputs.expect_date }}"
          else
            EXPECT="$(TZ=Asia/Taipei date +%Y-%m-%d)"
          fi
          echo "expect_date=${EXPECT}" >> "$GITHUB_OUTPUT"
          echo "Expecting Moravian date: ${EXPECT}"

      - name: Fetch and generate daily texts
        run: |
          args=(
            --expect-date "${{ steps.dates.outputs.expect_date }}"
            --fail-on-skip
            -v
          )
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          daily-texts fetch "${args[@]}"

      - name: Verify site day page exists
        run: |
          DAY="${{ steps.dates.outputs.expect_date }}"
          test -f "site/${DAY}.html"
          test -f site/index.html
          echo "Generated site/${DAY}.html and refreshed index.html"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/
          if git diff --staged --quiet; then
            echo "No site/ changes; nothing to commit (idempotent rerun)."
            exit 0
          fi

          DAY="${{ steps.dates.outputs.expect_date }}"
          git commit -m "$(cat <<EOF
          chore: publish daily text ${DAY}

          Generated by daily-publish workflow.
          EOF
          )"
          git push origin HEAD:master
