# Daily fetch → localize → update site/ → commit/push to master.
# GitHub Pages deploy stays in pages.yml (triggered by site/** pushes).
# Late-day alarm if neither run published: daily-watchdog.yml
#
# Schedule (UTC → Asia/Taipei):
#   0 6 * * *   → 14:00 Taipei (primary; ~1h after Eastern 01:00 EDT)
#   0 9 * * *   → 17:00 Taipei (retry if first run missed / Moravian late)
# If site/{today}.html already exists, the retry exits early (saves Actions minutes).
# Edit the cron lines below to change the schedule (GitHub cron is always UTC).

name: Daily Publish

on:
  schedule:
    # Configurable: change these cron expressions (UTC).
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite existing output for the day"
        type: boolean
        default: false
      expect_date:
        description: "Expected page date YYYY-MM-DD (empty = today in Asia/Taipei)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
      PROVIDER: moravian_html
      FORMATS: markdown,html,text,json
      PUBLISHERS: static_site
      SITE_DIR: ./site
      OUTPUT_DIR: ./output
      # No Ollama on runners. Prefer Google Translate (free tier) then paid LLMs.
      # Without any key, fallback keeps the English prayer.
      TRANSLATOR: composite
      TRANSLATORS: google,openai,anthropic,fallback
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: claude-haiku-4-5
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Backward-compatible if the old secret name is still present.
      GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
      HTTP_MAX_RETRIES: "3"
      HTTP_RETRY_BACKOFF_SECONDS: "1.0"
      HTTP_USER_AGENT: daily-texts-bot/1.0

    steps:
      - name: Label schedule trigger
        id: trigger
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ -n "$SCHEDULE" ]; then
            LABEL="schedule:${SCHEDULE}"
          else
            LABEL="manual"
          fi
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "Run trigger: ${LABEL}"
          echo "Event: ${{ github.event_name }} / run_id=${{ github.run_id }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history not required; token needs write for push.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve expect date
        id: dates
        run: |
          if [ -n "${{ inputs.expect_date }}" ]; then
            EXPECT="${{ inputs.expect_date }}"
          else
            EXPECT="$(TZ=Asia/Taipei date +%Y-%m-%d)"
          fi
          echo "expect_date=${EXPECT}" >> "$GITHUB_OUTPUT"
          echo "Expecting Moravian date: ${EXPECT}"
          echo "Trigger: ${{ steps.trigger.outputs.label }}"

      - name: Skip if already published
        id: skip
        run: |
          DAY="${{ steps.dates.outputs.expect_date }}"
          FORCE="${{ inputs.force }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force requested; will republish ${DAY}."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "site/${DAY}.html" ]; then
            echo "site/${DAY}.html already on master; skipping fetch (save Actions minutes)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "site/${DAY}.html missing; proceeding with fetch."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: pip install -e .

      - name: Fetch and generate daily texts
        if: steps.skip.outputs.skip != 'true'
        run: |
          args=(
            --expect-date "${{ steps.dates.outputs.expect_date }}"
            --fail-on-skip
            -v
          )
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          daily-texts fetch "${args[@]}"

      - name: Prayer translation summary
        if: steps.skip.outputs.skip != 'true' && success()
        run: |
          DAY="${{ steps.dates.outputs.expect_date }}"
          JSON="output/${DAY}/daily-text.json"
          if [ ! -f "$JSON" ]; then
            echo "No ${JSON}; skip translation summary."
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          day = """${{ steps.dates.outputs.expect_date }}"""
          path = Path(f"output/{day}/daily-text.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          report = data.get("translation") or {}
          prayer = data.get("prayer") or ""
          print("=== Prayer translation ===")
          print(f"date: {day}")
          print(f"provider: {report.get('provider')}")
          print(f"status: {report.get('status')}")
          print(f"kept_english: {report.get('kept_english')}")
          print(f"source_chars: {report.get('source_chars')}")
          print(f"result_chars: {report.get('result_chars')}")
          if report.get("skipped"):
              print(f"skipped: {', '.join(report['skipped'])}")
          if report.get("failed"):
              for item in report["failed"]:
                  print(f"failed: {item.get('name')}: {item.get('error')}")
          if report.get("error"):
              print(f"error: {report['error']}")
          preview = prayer.replace("\n", " ")
          if len(preview) > 120:
              preview = preview[:117] + "..."
          print(f"prayer_preview: {preview}")
          if report.get("kept_english") or report.get("status") in {
              "fallback_english",
              "failed_kept_english",
              "all_failed",
          }:
              print("WARNING: prayer appears to be English fallback; check API keys/quota.")
              sys.exit(0)
          print("OK: prayer looks translated.")
          PY

      - name: Verify site day page exists
        if: steps.skip.outputs.skip != 'true'
        run: |
          DAY="${{ steps.dates.outputs.expect_date }}"
          test -f "site/${DAY}.html"
          test -f site/index.html
          echo "Generated site/${DAY}.html and refreshed index.html"

      - name: Commit and push if changed
        id: push
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/
          if git diff --staged --quiet; then
            echo "No site/ changes; nothing to commit (idempotent rerun)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DAY="${{ steps.dates.outputs.expect_date }}"
          TRIGGER="${{ steps.trigger.outputs.label }}"
          git commit -m "$(cat <<EOF
          chore: publish daily text ${DAY}

          Generated by daily-publish (${TRIGGER}).
          EOF
          )"
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger other workflows; dispatch Pages explicitly.
      - name: Trigger Pages deploy
        if: steps.skip.outputs.skip != 'true' && steps.push.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pages.yml",
              ref: "master",
            });
            console.log("Dispatched pages.yml workflow_dispatch");
