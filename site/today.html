  <script>
(function () {
  "use strict";
  var TZ = "Asia/Taipei";
  function todayIso() {
    try {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
    } catch (err) {
      var d = new Date();
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
  }
  var iso = todayIso();
  var target = iso + ".html";
  var q = window.location.search || "";
  var h = window.location.hash || "";
  window.location.replace(target + q + h);
})();
  </script>
