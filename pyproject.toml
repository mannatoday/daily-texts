[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-texts"
version = "0.1.0"
description = "Fetch Moravian Daily Texts, localize to Traditional Chinese (RCUV), and export to multiple formats."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-asyncio>=0.23.0,<1",
    "respx>=0.21.0,<0.23",
]

[project.scripts]
daily-texts = "daily_texts.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_texts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
    "/.env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that require network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
